,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">Atomic Publishing</text><text x="680" y="214" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#94A3B8">.part &#8594; atomic rename</text><circle cx="932" cy="178" r="3" fill="#FFB703" fill-opacity="0.85"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="2.6s" repeatCount="indefinite"/></circle></g><g opacity="1"><animate attributeName="opacity" dur="11.0s" repeatCount="indefinite" keyTimes="0 0.124 0.154 1" values="0;0;1;1"/><animateTransform attributeName="transform" type="translate" dur="11.0s" repeatCount="indefinite" keyTimes="0 0.124 0.154 1" values="0,8;0,8;0,0;0,0"/><rect x="30" y="268" width="292" height="96" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.3"/><rect x="30" y="268" width="4" height="96" rx="2" fill="#EF476F"/><text x="52" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#EF476F">04</text><text x="90" y="302" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F8FAFC">Watchdogs</text><text x="52" y="330" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#94A3B8">Timeouts on net &amp; disk ops</text><circle cx="304" cy="294" r="3" fill="#EF476F" fill-opacity="0.85"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="2.9s" repeatCount="indefinite"/></circle></g><g opacity="1"><animate attributeName="opacity" dur="11.0s" repeatCount="indefinite" keyTimes="0 0.152 0.182 1" values="0;0;1;1"/><animateTransform attributeName="transform" type="translate" dur="11.0s" repeatCount="indefinite" keyTimes="0 0.152 0.182 1" values="0,8;0,8;0,0;0,0"/><rect x="344" y="268" width="292" height="96" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.3"/><rect x="344" y="268" width="4" height="96" rx="2" fill